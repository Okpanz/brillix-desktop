name: Build and Release Desktop

# Builds Brillix Desktop for:
# - macOS Universal (Apple Silicon + Intel)
# - Windows x64
#
# The Tauri shell lives in this repository (brillix-desktop).
# The actual React application lives in the separate private
# Okpanz/biz-insight repository.
#
# Installers are published to Cloudflare R2 (the same bucket brillix-api
# already uses) at a fixed path, so the public download URL never changes
# between releases — this repo is private, so GitHub Release assets
# aren't publicly downloadable, which is why R2 is the actual distribution
# point and the GitHub Release is kept only as internal history.
#
# Required repository secrets:
#   BIZ_INSIGHT_PAT       — read access to Okpanz/biz-insight
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME
#   R2_PUBLIC_URL         — e.g. https://pub-xxxx.r2.dev (used by the
#                           downloads page config, not by this workflow)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    name: macOS (Universal)
    runs-on: macos-latest

    steps:
      # ---------------------------------------------------------
      # Checkout desktop shell
      # ---------------------------------------------------------
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5
        with:
          path: brillix-desktop

      # ---------------------------------------------------------
      # Verify access to private biz-insight repository
      # ---------------------------------------------------------
      - name: Verify biz-insight access
        shell: bash
        env:
          BIZ_INSIGHT_PAT: ${{ secrets.BIZ_INSIGHT_PAT }}
        run: |
          if [ -z "$BIZ_INSIGHT_PAT" ]; then
            echo "ERROR: BIZ_INSIGHT_PAT secret is not configured."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $BIZ_INSIGHT_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Okpanz/biz-insight)

          echo "GitHub API response: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Cannot access Okpanz/biz-insight."
            echo "Check BIZ_INSIGHT_PAT repository access and permissions."
            exit 1
          fi

          echo "Successfully authenticated to Okpanz/biz-insight."

      # ---------------------------------------------------------
      # Checkout private frontend repository
      # ---------------------------------------------------------
      - name: Checkout biz-insight
        uses: actions/checkout@v5
        with:
          repository: Okpanz/biz-insight
          path: biz-insight
          token: ${{ secrets.BIZ_INSIGHT_PAT }}

      # ---------------------------------------------------------
      # Node
      # ---------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            biz-insight/package-lock.json
            brillix-desktop/package-lock.json

      # ---------------------------------------------------------
      # Rust
      # ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # ---------------------------------------------------------
      # Frontend dependencies
      # ---------------------------------------------------------
      - name: Install biz-insight dependencies
        working-directory: biz-insight
        run: npm ci

      # ---------------------------------------------------------
      # Tauri dependencies
      # ---------------------------------------------------------
      - name: Install brillix-desktop dependencies
        working-directory: brillix-desktop
        run: npm ci

      # ---------------------------------------------------------
      # Build macOS Universal
      # ---------------------------------------------------------
      - name: Build Universal macOS app
        working-directory: brillix-desktop
        run: npx tauri build --target universal-apple-darwin

      # ---------------------------------------------------------
      # Collect release artifact
      # ---------------------------------------------------------
      - name: Collect macOS release asset
        shell: bash
        run: |
          set -e

          mkdir -p release-assets

          DMG=$(find \
            brillix-desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg \
            -maxdepth 1 \
            -type f \
            -name "*.dmg" \
            | head -n 1)

          if [ -z "$DMG" ]; then
            echo "ERROR: macOS DMG was not generated."
            exit 1
          fi

          cp "$DMG" \
            release-assets/Brillix-macOS-Universal.dmg

          echo "Created:"
          ls -lh release-assets/

      # ---------------------------------------------------------
      # Publish to R2 (public download URL — brillix-desktop is a
      # private repo, so GitHub Release assets aren't publicly
      # downloadable; the /downloads page links here instead).
      # Fixed key means the public URL never changes between
      # releases — only the file content does.
      # ---------------------------------------------------------
      - name: Upload macOS installer to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp release-assets/Brillix-macOS-Universal.dmg \
            "s3://${{ secrets.R2_BUCKET_NAME }}/desktop-releases/Brillix-macOS-Universal.dmg" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/x-apple-diskimage

      # ---------------------------------------------------------
      # Also keep a versioned GitHub Release for internal history
      # (private repo, not used for public downloads).
      # ---------------------------------------------------------
      - name: Record GitHub Release (internal)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Brillix-macOS-Universal.dmg
          draft: false
          body_path: brillix-desktop/RELEASE_NOTES.md


  # =================================================================
  # WINDOWS
  # =================================================================

  windows:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
      # ---------------------------------------------------------
      # Checkout desktop shell
      # ---------------------------------------------------------
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5
        with:
          path: brillix-desktop

      # ---------------------------------------------------------
      # Verify access to private biz-insight repository
      # ---------------------------------------------------------
      - name: Verify biz-insight access
        shell: bash
        env:
          BIZ_INSIGHT_PAT: ${{ secrets.BIZ_INSIGHT_PAT }}
        run: |
          if [ -z "$BIZ_INSIGHT_PAT" ]; then
            echo "ERROR: BIZ_INSIGHT_PAT secret is not configured."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $BIZ_INSIGHT_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Okpanz/biz-insight)

          echo "GitHub API response: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Cannot access Okpanz/biz-insight."
            echo "Check BIZ_INSIGHT_PAT repository access and permissions."
            exit 1
          fi

          echo "Successfully authenticated to Okpanz/biz-insight."

      # ---------------------------------------------------------
      # Checkout private frontend repository
      # ---------------------------------------------------------
      - name: Checkout biz-insight
        uses: actions/checkout@v5
        with:
          repository: Okpanz/biz-insight
          path: biz-insight
          token: ${{ secrets.BIZ_INSIGHT_PAT }}

      # ---------------------------------------------------------
      # Node
      # ---------------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            biz-insight/package-lock.json
            brillix-desktop/package-lock.json

      # ---------------------------------------------------------
      # Rust
      # ---------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ---------------------------------------------------------
      # Frontend dependencies
      # ---------------------------------------------------------
      - name: Install biz-insight dependencies
        working-directory: biz-insight
        run: npm ci

      # ---------------------------------------------------------
      # Tauri dependencies
      # ---------------------------------------------------------
      - name: Install brillix-desktop dependencies
        working-directory: brillix-desktop
        run: npm ci

      # ---------------------------------------------------------
      # Build Windows x64
      # ---------------------------------------------------------
      - name: Build Windows app
        working-directory: brillix-desktop
        run: npx tauri build

      # ---------------------------------------------------------
      # Collect release artifact
      # ---------------------------------------------------------
      - name: Collect Windows release asset
        shell: bash
        run: |
          set -e

          mkdir -p release-assets

          EXE=$(find \
            brillix-desktop/src-tauri/target/release/bundle/nsis \
            -maxdepth 1 \
            -type f \
            -name "*.exe" \
            | head -n 1)

          if [ -z "$EXE" ]; then
            echo "ERROR: Windows NSIS installer was not generated."
            exit 1
          fi

          cp "$EXE" \
            release-assets/Brillix-Windows-x64-Setup.exe

          echo "Created:"
          ls -lh release-assets/

      # ---------------------------------------------------------
      # Publish to R2 (see macOS job for why — brillix-desktop is
      # private, so GitHub Release assets can't be downloaded
      # publicly; fixed key keeps the public URL stable).
      # ---------------------------------------------------------
      - name: Upload Windows installer to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp release-assets/Brillix-Windows-x64-Setup.exe \
            "s3://${{ secrets.R2_BUCKET_NAME }}/desktop-releases/Brillix-Windows-x64-Setup.exe" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/vnd.microsoft.portable-executable

      # ---------------------------------------------------------
      # Also keep a versioned GitHub Release for internal history
      # (private repo, not used for public downloads).
      # ---------------------------------------------------------
      - name: Record GitHub Release (internal)
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/Brillix-Windows-x64-Setup.exe
          draft: false
          body_path: brillix-desktop/RELEASE_NOTES.md