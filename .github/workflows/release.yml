name: Build and Release Desktop

# Builds Brillix Desktop for:
# - macOS Universal (Apple Silicon + Intel) — Apple Developer ID signed and
#   notarized, so Gatekeeper accepts it with no "Open Anyway" workaround.
# - Windows x64
#
# The Tauri shell lives in this repository (brillix-desktop).
# The actual React application lives in the separate private
# Okpanz/biz-insight repository.
#
# Installers AND the auto-updater artifacts/manifest are published to
# Cloudflare R2 (the same bucket brillix-api already uses) at fixed keys,
# so the public download URL and the updater endpoint never change between
# releases — this repo is private, so GitHub Release assets aren't
# publicly downloadable, which is why R2 is the actual distribution point
# and the GitHub Release is kept only as internal history.
#
# Two ways to run this workflow:
#   - Push a tag matching v*.*.* (e.g. v1.0.2): a full production release —
#     both platforms build, macOS is Apple-signed/notarized/stapled and
#     Gatekeeper-validated, artifacts publish to R2, the updater manifest is
#     published, and exactly one GitHub Release is created for that tag.
#     Apple signing secrets are REQUIRED for a tagged release — the run
#     fails fast if they're missing rather than publishing an unsigned
#     production build.
#   - workflow_dispatch (manual run): builds both platforms and publishes to
#     R2 for testing, but never creates a GitHub Release (there is no tag to
#     attach one to). Apple signing runs only if the secrets happen to be
#     configured; otherwise it builds an unsigned macOS app, same as before
#     this signing pipeline existed.
#
# Required repository secrets:
#   BIZ_INSIGHT_PAT                     — read access to Okpanz/biz-insight
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME
#   R2_PUBLIC_URL                       — e.g. https://pub-xxxx.r2.dev
#   TAURI_SIGNING_PRIVATE_KEY           — from `tauri signer generate` (Tauri
#                                          UPDATER signing — separate from,
#                                          and unrelated to, Apple signing
#                                          below; do not confuse the two)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — may be empty if the key has none
#
# Required secrets for macOS Apple Developer ID signing + notarization
# (required for a tagged release; optional for a manual test run):
#   APPLE_CERTIFICATE                   — base64-encoded Developer ID
#                                          Application .p12 certificate
#   APPLE_CERTIFICATE_PASSWORD          — password the .p12 was exported with
#   APPLE_SIGNING_IDENTITY              — e.g. "Developer ID Application:
#                                          Your Name/Org (TEAMID)"
#   APPLE_TEAM_ID                       — your Apple Developer Team ID
#   APPLE_API_KEY_ID                    — App Store Connect API key ID
#   APPLE_API_ISSUER                    — App Store Connect API issuer ID
#   APPLE_API_PRIVATE_KEY               — the API key's .p8 file contents,
#                                          pasted as-is (not base64)
# All seven must be set together — see the repo README / project docs for
# how to obtain each one.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =================================================================
  # VALIDATE — runs first, on a cheap ubuntu runner, before any expensive
  # macOS/Windows build starts. Decides whether this run is a tagged
  # production release or a manual test run, and fails fast (before
  # spending build minutes) on a malformed tag, a tag/tauri.conf.json
  # version mismatch, a missing required secret, or (for a tagged release)
  # missing Apple signing secrets.
  # =================================================================

  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      is_tag_release: ${{ steps.detect.outputs.is_tag_release }}
      version: ${{ steps.detect.outputs.version }}
      apple_signing_enabled: ${{ steps.secrets_check.outputs.apple_signing_enabled }}

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5

      - name: Detect release type and validate version
        id: detect
        shell: bash
        run: |
          set -e
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Tagged production release detected: $TAG"

            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Tag '$TAG' does not match the required vX.Y.Z format (e.g. v1.0.2)."
              exit 1
            fi

            TAG_VERSION="${TAG#v}"
            echo "Tag version:   $TAG_VERSION"
            echo "Tauri version: $TAURI_VERSION"

            if [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
              echo "ERROR: Git tag version ($TAG_VERSION) does not match src-tauri/tauri.conf.json version ($TAURI_VERSION)."
              echo "Update the version in tauri.conf.json (and package.json / Cargo.toml), commit it, then re-tag."
              exit 1
            fi

            echo "is_tag_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Manual test build detected (workflow_dispatch). GitHub Release creation will be skipped because no release tag exists."
            echo "is_tag_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$TAURI_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required secrets are present
        id: secrets_check
        shell: bash
        env:
          BIZ_INSIGHT_PAT: ${{ secrets.BIZ_INSIGHT_PAT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          IS_TAG_RELEASE: ${{ steps.detect.outputs.is_tag_release }}
        run: |
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD is intentionally not checked
          # here — an empty passphrase on the signing key is valid.
          missing=0
          for name in BIZ_INSIGHT_PAT R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_URL TAURI_SIGNING_PRIVATE_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "ERROR: required secret $name is not set."
              missing=1
            fi
          done

          apple_missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_API_PRIVATE_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              apple_missing=1
            fi
          done

          if [ "$apple_missing" -eq 0 ]; then
            echo "Apple Developer ID signing secrets are present — macOS build will be signed and notarized."
            echo "apple_signing_enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_TAG_RELEASE" == "true" ]; then
            echo "ERROR: this is a tagged production release, but one or more Apple signing secrets are missing."
            echo "Required: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_TEAM_ID, APPLE_API_KEY_ID, APPLE_API_ISSUER, APPLE_API_PRIVATE_KEY."
            echo "A production macOS release must be signed and notarized — refusing to publish an unsigned build."
            missing=1
          else
            echo "Apple signing secrets are not fully configured — this manual run will build an UNSIGNED macOS app (fine for testing, not for distribution)."
            echo "apple_signing_enabled=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All required secrets are present."

  # =================================================================
  # MACOS — builds, Apple-signs, notarizes, staples, validates, and
  # uploads to R2. GitHub Release creation happens once, later, in
  # publish-github-release.
  # =================================================================

  macos:
    name: macOS (Universal)
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5
        with:
          path: brillix-desktop

      - name: Verify biz-insight access
        shell: bash
        env:
          BIZ_INSIGHT_PAT: ${{ secrets.BIZ_INSIGHT_PAT }}
        run: |
          if [ -z "$BIZ_INSIGHT_PAT" ]; then
            echo "ERROR: BIZ_INSIGHT_PAT secret is not configured."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $BIZ_INSIGHT_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Okpanz/biz-insight)

          echo "GitHub API response: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Cannot access Okpanz/biz-insight."
            echo "Check BIZ_INSIGHT_PAT repository access and permissions."
            exit 1
          fi

          echo "Successfully authenticated to Okpanz/biz-insight."

      - name: Checkout biz-insight
        uses: actions/checkout@v5
        with:
          repository: Okpanz/biz-insight
          path: biz-insight
          token: ${{ secrets.BIZ_INSIGHT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            biz-insight/package-lock.json
            brillix-desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install biz-insight dependencies
        working-directory: biz-insight
        run: npm ci

      - name: Install brillix-desktop dependencies
        working-directory: brillix-desktop
        run: npm ci

      # Apple Developer ID signing is separate from, and unrelated to, the
      # Tauri updater signing below (TAURI_SIGNING_PRIVATE_KEY) — this is
      # what satisfies macOS Gatekeeper; the updater key only lets the app's
      # own auto-updater trust a downloaded update package. A temporary,
      # job-scoped keychain is used instead of the runner's login keychain,
      # and is deleted in the cleanup step at the end of this job.
      - name: Import Apple Developer ID certificate
        if: needs.validate.outputs.apple_signing_enabled == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/apple-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$APPLE_CERTIFICATE" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

          rm -f "$CERTIFICATE_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          echo "Imported signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # App Store Connect API key auth for notarytool — Apple's recommended
      # non-interactive method for CI (no Apple ID / app-specific password /
      # 2FA involved). The .p8 contents are written to a file only Tauri's
      # build process reads; the path is exported via GITHUB_ENV so the
      # build step below picks it up as APPLE_API_KEY_PATH automatically.
      - name: Write Apple API private key for notarization
        if: needs.validate.outputs.apple_signing_enabled == 'true'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          set -e
          KEY_PATH="$RUNNER_TEMP/apple_api_key.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] being set makes Tauri sign the
      # updater artifact (the .app.tar.gz alongside the .dmg) automatically —
      # see tauri.conf.json's bundle.createUpdaterArtifacts. Separately, when
      # APPLE_SIGNING_IDENTITY (and the other Apple secrets below) are set,
      # Tauri's bundler codesigns the .app with the Developer ID identity
      # from the keychain imported above, then notarizes and staples it with
      # Apple, all as part of this one build command — no separate manual
      # notarytool/stapler invocation is needed for the primary artifacts.
      # When Apple signing is disabled (manual run, no secrets configured),
      # these env vars are simply empty and Tauri produces an unsigned app,
      # exactly as it did before this signing pipeline existed.
      - name: Build Universal macOS app
        working-directory: brillix-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: npx tauri build --target universal-apple-darwin

      # Fails the build if the shipped binary isn't actually a fat/universal
      # binary — catches a misconfigured target or a toolchain regression
      # before it ever reaches a customer's Intel or Apple Silicon Mac.
      - name: Verify universal binary (arm64 + x86_64)
        shell: bash
        run: |
          set -e
          BINARY="brillix-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/Brillix.app/Contents/MacOS/Brillix"

          if [ ! -f "$BINARY" ]; then
            echo "ERROR: expected universal binary not found at $BINARY"
            exit 1
          fi

          echo "file: $(file "$BINARY")"
          LIPO_INFO=$(lipo -info "$BINARY")
          echo "lipo -info: $LIPO_INFO"

          if ! echo "$LIPO_INFO" | grep -q "x86_64" || ! echo "$LIPO_INFO" | grep -q "arm64"; then
            echo "ERROR: the built app is not a universal binary (expected both x86_64 and arm64 slices)."
            exit 1
          fi
          echo "Universal binary check: PASSED (contains arm64 + x86_64)"

      - name: Collect macOS release assets
        id: collect
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="brillix-desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p release-assets

          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name "*.dmg" | head -n 1)
          UPDATER=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name "*.app.tar.gz" | head -n 1)
          SIG_FILE=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name "*.app.tar.gz.sig" | head -n 1)

          if [ -z "$DMG" ] || [ -z "$UPDATER" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: expected macOS build outputs were not all generated."
            echo "dmg=$DMG updater=$UPDATER sig=$SIG_FILE"
            exit 1
          fi

          cp "$DMG" release-assets/Brillix-macOS-Universal.dmg
          cp "$UPDATER" release-assets/Brillix-macOS-Universal.app.tar.gz
          cp "$SIG_FILE" release-assets/Brillix-macOS-Universal.app.tar.gz.sig

          echo "signature=$(cat "$SIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "Created:"
          ls -lh release-assets/

      # Validates the EXACT artifact a customer downloads (mounts the real
      # DMG rather than re-checking the pre-packaging build directory), so
      # a passing result here means Gatekeeper will genuinely accept it —
      # not just that signing "ran" earlier in the build. Fails the whole
      # job (before R2 upload) if any check fails.
      - name: Validate Apple signing, notarization, and Gatekeeper acceptance
        if: needs.validate.outputs.apple_signing_enabled == 'true'
        shell: bash
        run: |
          set -e
          DMG="release-assets/Brillix-macOS-Universal.dmg"
          MOUNT_POINT="$RUNNER_TEMP/brillix-dmg-mount"
          mkdir -p "$MOUNT_POINT"

          cleanup() {
            hdiutil detach "$MOUNT_POINT" -quiet 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach "$DMG" -mountpoint "$MOUNT_POINT" -nobrowse -quiet
          APP_PATH=$(find "$MOUNT_POINT" -maxdepth 1 -type d -name "*.app" | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: could not find a .app bundle inside the mounted DMG."
            exit 1
          fi

          echo "--- codesign --verify --deep --strict ---"
          if ! codesign --verify --deep --strict --verbose=2 "$APP_PATH"; then
            echo "Apple signing: FAILED"
            exit 1
          fi
          echo "Apple signing: PASSED"

          echo "--- xcrun stapler validate (notarization ticket) ---"
          if ! xcrun stapler validate "$APP_PATH"; then
            echo "Notarization: FAILED"
            echo "Stapling: FAILED"
            exit 1
          fi
          echo "Notarization: PASSED"
          echo "Stapling: PASSED"

          echo "--- spctl --assess (Gatekeeper simulation) ---"
          if ! spctl --assess --type execute --verbose=4 "$APP_PATH"; then
            echo "Gatekeeper validation: FAILED"
            exit 1
          fi
          echo "Gatekeeper validation: PASSED"

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already available: $(aws --version)"
          else
            echo "AWS CLI not found on this runner — installing via pip..."
            PYTHON_BIN=$(command -v python3 || command -v python)
            "$PYTHON_BIN" -m pip install --user --quiet awscli
            echo "$HOME/Library/Python/3.9/bin" >> "$GITHUB_PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Upload macOS assets to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_BUCKET_NAME }}/desktop-releases"

          aws s3 cp release-assets/Brillix-macOS-Universal.dmg "$BUCKET/Brillix-macOS-Universal.dmg" \
            --endpoint-url "$ENDPOINT" --content-type application/x-apple-diskimage
          aws s3 cp release-assets/Brillix-macOS-Universal.app.tar.gz "$BUCKET/Brillix-macOS-Universal.app.tar.gz" \
            --endpoint-url "$ENDPOINT" --content-type application/gzip
          aws s3 cp release-assets/Brillix-macOS-Universal.app.tar.gz.sig "$BUCKET/Brillix-macOS-Universal.app.tar.gz.sig" \
            --endpoint-url "$ENDPOINT" --content-type text/plain

      # A universal binary reports as darwin-aarch64 when running on Apple
      # Silicon and darwin-x86_64 on Intel (the updater checks cfg!(target_arch)
      # at runtime, which reflects whichever slice of the fat binary the OS
      # loaded) — both keys need an entry, and since it's the same file for
      # both, they point at the same URL/signature. This fragment gets merged
      # with Windows' in the publish-manifest job below.
      - name: Save platform manifest fragment
        shell: bash
        run: |
          mkdir -p fragment
          cat > fragment/macos.json <<EOF
          {
            "darwin-aarch64": {
              "signature": "${{ steps.collect.outputs.signature }}",
              "url": "${{ secrets.R2_PUBLIC_URL }}/desktop-releases/Brillix-macOS-Universal.app.tar.gz"
            },
            "darwin-x86_64": {
              "signature": "${{ steps.collect.outputs.signature }}",
              "url": "${{ secrets.R2_PUBLIC_URL }}/desktop-releases/Brillix-macOS-Universal.app.tar.gz"
            }
          }
          EOF

      - name: Upload platform fragment
        uses: actions/upload-artifact@v4
        with:
          name: manifest-fragment-macos
          path: fragment/macos.json

      # Consumed only by publish-github-release, and only for a tagged run —
      # kept as a build artifact rather than a GitHub Release so macOS and
      # Windows never race to create/update the same Release.
      - name: Upload macOS release assets (for GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets
          retention-days: 1

      # GitHub-hosted macOS runners are destroyed after the job regardless,
      # but this removes the temporary keychain and the decoded certificate
      # / API key files as defense in depth, and runs even if an earlier
      # step in this job failed.
      - name: Clean up Apple signing keychain and key files
        if: always() && needs.validate.outputs.apple_signing_enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apple-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/apple-certificate.p12" "$RUNNER_TEMP/apple_api_key.p8" 2>/dev/null || true
          echo "Cleaned up temporary Apple signing keychain and key files."

  # =================================================================
  # WINDOWS — builds and uploads to R2 only. No Apple-specific logic here.
  # Same job-split-from-Release-creation pattern as macOS above.
  # =================================================================

  windows:
    name: Windows (x64)
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5
        with:
          path: brillix-desktop

      - name: Verify biz-insight access
        shell: bash
        env:
          BIZ_INSIGHT_PAT: ${{ secrets.BIZ_INSIGHT_PAT }}
        run: |
          if [ -z "$BIZ_INSIGHT_PAT" ]; then
            echo "ERROR: BIZ_INSIGHT_PAT secret is not configured."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $BIZ_INSIGHT_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Okpanz/biz-insight)

          echo "GitHub API response: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Cannot access Okpanz/biz-insight."
            echo "Check BIZ_INSIGHT_PAT repository access and permissions."
            exit 1
          fi

          echo "Successfully authenticated to Okpanz/biz-insight."

      - name: Checkout biz-insight
        uses: actions/checkout@v5
        with:
          repository: Okpanz/biz-insight
          path: biz-insight
          token: ${{ secrets.BIZ_INSIGHT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            biz-insight/package-lock.json
            brillix-desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install biz-insight dependencies
        working-directory: biz-insight
        run: npm ci

      - name: Install brillix-desktop dependencies
        working-directory: brillix-desktop
        run: npm ci

      - name: Build Windows app
        working-directory: brillix-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Collect Windows release assets
        id: collect
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="brillix-desktop/src-tauri/target/release/bundle/nsis"
          mkdir -p release-assets

          EXE=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name "*.exe" | head -n 1)
          SIG_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name "*.exe.sig" | head -n 1)

          if [ -z "$EXE" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: expected Windows build outputs were not all generated."
            echo "exe=$EXE sig=$SIG_FILE"
            exit 1
          fi

          cp "$EXE" release-assets/Brillix-Windows-x64-Setup.exe
          cp "$SIG_FILE" release-assets/Brillix-Windows-x64-Setup.exe.sig

          echo "signature=$(cat "$SIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "Created:"
          ls -lh release-assets/

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already available: $(aws --version)"
          else
            echo "AWS CLI not found on this runner — installing via pip..."
            PYTHON_BIN=$(command -v python3 || command -v python)
            "$PYTHON_BIN" -m pip install --user --quiet awscli
            echo "$APPDATA/Python/Scripts" >> "$GITHUB_PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Upload Windows assets to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_BUCKET_NAME }}/desktop-releases"

          aws s3 cp release-assets/Brillix-Windows-x64-Setup.exe "$BUCKET/Brillix-Windows-x64-Setup.exe" \
            --endpoint-url "$ENDPOINT" --content-type application/vnd.microsoft.portable-executable
          aws s3 cp release-assets/Brillix-Windows-x64-Setup.exe.sig "$BUCKET/Brillix-Windows-x64-Setup.exe.sig" \
            --endpoint-url "$ENDPOINT" --content-type text/plain

      - name: Save platform manifest fragment
        shell: bash
        run: |
          mkdir -p fragment
          cat > fragment/windows.json <<EOF
          {
            "windows-x86_64": {
              "signature": "${{ steps.collect.outputs.signature }}",
              "url": "${{ secrets.R2_PUBLIC_URL }}/desktop-releases/Brillix-Windows-x64-Setup.exe"
            }
          }
          EOF

      - name: Upload platform fragment
        uses: actions/upload-artifact@v4
        with:
          name: manifest-fragment-windows
          path: fragment/windows.json

      # Consumed only by publish-github-release, and only for a tagged run —
      # see the matching step in the macos job for why this isn't a Release
      # created directly from this job.
      - name: Upload Windows release assets (for GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets
          retention-days: 1

  # =================================================================
  # UPDATER MANIFEST — merges both platform jobs' fragments into the
  # single latest.json the desktop app polls (tauri.conf.json's
  # plugins.updater.endpoints). Runs on every trigger (tag or manual)
  # so manual runs can be used to test the full R2 publish path.
  # =================================================================

  publish-manifest:
    name: Publish updater manifest
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5

      - name: Download platform fragments
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-fragment-*
          path: fragments
          merge-multiple: true

      - name: Build and upload latest.json
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -e
          NOTES=$(cat RELEASE_NOTES.md)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --slurpfile macos fragments/macos.json \
            --slurpfile windows fragments/windows.json \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: ($macos[0] + $windows[0])
            }' > latest.json

          echo "Generated manifest:"
          cat latest.json

          aws s3 cp latest.json "s3://${{ secrets.R2_BUCKET_NAME }}/desktop-releases/latest.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json \
            --cache-control "no-cache"

  # =================================================================
  # GITHUB RELEASE — the single place a GitHub Release is created.
  # Only runs for a tagged production release (push of a v*.*.* tag);
  # never for workflow_dispatch, where there is no tag to attach a
  # release to. Artifacts come from the macOS/Windows jobs' uploaded
  # build artifacts, not the local filesystem of this job's runner.
  # =================================================================

  publish-github-release:
    name: Publish GitHub Release
    needs: [validate, macos, windows, publish-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5

      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Brillix Desktop ${{ github.ref_name }}
          draft: false
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/Brillix-macOS-Universal.dmg
            release-assets/Brillix-macOS-Universal.app.tar.gz
            release-assets/Brillix-macOS-Universal.app.tar.gz.sig
            release-assets/Brillix-Windows-x64-Setup.exe
            release-assets/Brillix-Windows-x64-Setup.exe.sig
