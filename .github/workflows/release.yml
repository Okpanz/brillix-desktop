name: Build and Release Desktop

# Builds Brillix Desktop for:
# - macOS Universal (Apple Silicon + Intel)
# - Windows x64
#
# The Tauri shell lives in this repository (brillix-desktop).
# The actual React application lives in the separate private
# Okpanz/biz-insight repository.
#
# Installers AND the auto-updater artifacts/manifest are published to
# Cloudflare R2 (the same bucket brillix-api already uses) at fixed keys,
# so the public download URL and the updater endpoint never change between
# releases — this repo is private, so GitHub Release assets aren't
# publicly downloadable, which is why R2 is the actual distribution point
# and the GitHub Release is kept only as internal history.
#
# Two ways to run this workflow:
#   - Push a tag matching v*.*.* (e.g. v1.0.1): a full production release —
#     both platforms build, artifacts publish to R2, the updater manifest is
#     published, and exactly one GitHub Release is created for that tag.
#   - workflow_dispatch (manual run): builds both platforms and publishes to
#     R2 for testing, but never creates a GitHub Release (there is no tag to
#     attach one to).
#
# Required repository secrets:
#   BIZ_INSIGHT_PAT                     — read access to Okpanz/biz-insight
#   R2_ACCOUNT_ID
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET_NAME
#   R2_PUBLIC_URL                       — e.g. https://pub-xxxx.r2.dev
#   TAURI_SIGNING_PRIVATE_KEY           — from `tauri signer generate`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — may be empty if the key has none

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # =================================================================
  # VALIDATE — runs first, on a cheap ubuntu runner, before any expensive
  # macOS/Windows build starts. Decides whether this run is a tagged
  # production release or a manual test run, and fails fast (before
  # spending build minutes) on a malformed tag, a tag/tauri.conf.json
  # version mismatch, or a missing required secret.
  # =================================================================

  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      is_tag_release: ${{ steps.detect.outputs.is_tag_release }}
      version: ${{ steps.detect.outputs.version }}

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5

      - name: Detect release type and validate version
        id: detect
        shell: bash
        run: |
          set -e
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Tagged production release detected: $TAG"

            if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: Tag '$TAG' does not match the required vX.Y.Z format (e.g. v1.0.1)."
              exit 1
            fi

            TAG_VERSION="${TAG#v}"
            echo "Tag version:   $TAG_VERSION"
            echo "Tauri version: $TAURI_VERSION"

            if [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
              echo "ERROR: Git tag version ($TAG_VERSION) does not match src-tauri/tauri.conf.json version ($TAURI_VERSION)."
              echo "Update the version in tauri.conf.json (and package.json / Cargo.toml), commit it, then re-tag."
              exit 1
            fi

            echo "is_tag_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "Manual workflow run detected. GitHub Release creation will be skipped because no release tag exists."
            echo "is_tag_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$TAURI_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate required secrets are present
        shell: bash
        env:
          BIZ_INSIGHT_PAT: ${{ secrets.BIZ_INSIGHT_PAT }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD is intentionally not checked
          # here — an empty passphrase on the signing key is valid.
          missing=0
          for name in BIZ_INSIGHT_PAT R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_PUBLIC_URL TAURI_SIGNING_PRIVATE_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "ERROR: required secret $name is not set."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "All required secrets are present."

  # =================================================================
  # MACOS — builds and uploads to R2 only. GitHub Release creation
  # happens once, later, in publish-github-release.
  # =================================================================

  macos:
    name: macOS (Universal)
    needs: validate
    runs-on: macos-latest

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5
        with:
          path: brillix-desktop

      - name: Verify biz-insight access
        shell: bash
        env:
          BIZ_INSIGHT_PAT: ${{ secrets.BIZ_INSIGHT_PAT }}
        run: |
          if [ -z "$BIZ_INSIGHT_PAT" ]; then
            echo "ERROR: BIZ_INSIGHT_PAT secret is not configured."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $BIZ_INSIGHT_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Okpanz/biz-insight)

          echo "GitHub API response: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Cannot access Okpanz/biz-insight."
            echo "Check BIZ_INSIGHT_PAT repository access and permissions."
            exit 1
          fi

          echo "Successfully authenticated to Okpanz/biz-insight."

      - name: Checkout biz-insight
        uses: actions/checkout@v5
        with:
          repository: Okpanz/biz-insight
          path: biz-insight
          token: ${{ secrets.BIZ_INSIGHT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            biz-insight/package-lock.json
            brillix-desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install biz-insight dependencies
        working-directory: biz-insight
        run: npm ci

      - name: Install brillix-desktop dependencies
        working-directory: brillix-desktop
        run: npm ci

      # TAURI_SIGNING_PRIVATE_KEY[_PASSWORD] being set makes Tauri sign the
      # updater artifact (the .app.tar.gz alongside the .dmg) automatically —
      # see tauri.conf.json's bundle.createUpdaterArtifacts.
      - name: Build Universal macOS app
        working-directory: brillix-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin

      - name: Collect macOS release assets
        id: collect
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="brillix-desktop/src-tauri/target/universal-apple-darwin/release/bundle"
          mkdir -p release-assets

          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -type f -name "*.dmg" | head -n 1)
          UPDATER=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name "*.app.tar.gz" | head -n 1)
          SIG_FILE=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -type f -name "*.app.tar.gz.sig" | head -n 1)

          if [ -z "$DMG" ] || [ -z "$UPDATER" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: expected macOS build outputs were not all generated."
            echo "dmg=$DMG updater=$UPDATER sig=$SIG_FILE"
            exit 1
          fi

          cp "$DMG" release-assets/Brillix-macOS-Universal.dmg
          cp "$UPDATER" release-assets/Brillix-macOS-Universal.app.tar.gz
          cp "$SIG_FILE" release-assets/Brillix-macOS-Universal.app.tar.gz.sig

          echo "signature=$(cat "$SIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "Created:"
          ls -lh release-assets/

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already available: $(aws --version)"
          else
            echo "AWS CLI not found on this runner — installing via pip..."
            PYTHON_BIN=$(command -v python3 || command -v python)
            "$PYTHON_BIN" -m pip install --user --quiet awscli
            echo "$HOME/Library/Python/3.9/bin" >> "$GITHUB_PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Upload macOS assets to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_BUCKET_NAME }}/desktop-releases"

          aws s3 cp release-assets/Brillix-macOS-Universal.dmg "$BUCKET/Brillix-macOS-Universal.dmg" \
            --endpoint-url "$ENDPOINT" --content-type application/x-apple-diskimage
          aws s3 cp release-assets/Brillix-macOS-Universal.app.tar.gz "$BUCKET/Brillix-macOS-Universal.app.tar.gz" \
            --endpoint-url "$ENDPOINT" --content-type application/gzip
          aws s3 cp release-assets/Brillix-macOS-Universal.app.tar.gz.sig "$BUCKET/Brillix-macOS-Universal.app.tar.gz.sig" \
            --endpoint-url "$ENDPOINT" --content-type text/plain

      # A universal binary reports as darwin-aarch64 when running on Apple
      # Silicon and darwin-x86_64 on Intel (the updater checks cfg!(target_arch)
      # at runtime, which reflects whichever slice of the fat binary the OS
      # loaded) — both keys need an entry, and since it's the same file for
      # both, they point at the same URL/signature. This fragment gets merged
      # with Windows' in the publish-manifest job below.
      - name: Save platform manifest fragment
        shell: bash
        run: |
          mkdir -p fragment
          cat > fragment/macos.json <<EOF
          {
            "darwin-aarch64": {
              "signature": "${{ steps.collect.outputs.signature }}",
              "url": "${{ secrets.R2_PUBLIC_URL }}/desktop-releases/Brillix-macOS-Universal.app.tar.gz"
            },
            "darwin-x86_64": {
              "signature": "${{ steps.collect.outputs.signature }}",
              "url": "${{ secrets.R2_PUBLIC_URL }}/desktop-releases/Brillix-macOS-Universal.app.tar.gz"
            }
          }
          EOF

      - name: Upload platform fragment
        uses: actions/upload-artifact@v4
        with:
          name: manifest-fragment-macos
          path: fragment/macos.json

      # Consumed only by publish-github-release, and only for a tagged run —
      # kept as a build artifact rather than a GitHub Release so macOS and
      # Windows never race to create/update the same Release.
      - name: Upload macOS release assets (for GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets
          retention-days: 1

  # =================================================================
  # WINDOWS — builds and uploads to R2 only. Same split as macOS above.
  # =================================================================

  windows:
    name: Windows (x64)
    needs: validate
    runs-on: windows-latest

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5
        with:
          path: brillix-desktop

      - name: Verify biz-insight access
        shell: bash
        env:
          BIZ_INSIGHT_PAT: ${{ secrets.BIZ_INSIGHT_PAT }}
        run: |
          if [ -z "$BIZ_INSIGHT_PAT" ]; then
            echo "ERROR: BIZ_INSIGHT_PAT secret is not configured."
            exit 1
          fi

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer $BIZ_INSIGHT_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Okpanz/biz-insight)

          echo "GitHub API response: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Cannot access Okpanz/biz-insight."
            echo "Check BIZ_INSIGHT_PAT repository access and permissions."
            exit 1
          fi

          echo "Successfully authenticated to Okpanz/biz-insight."

      - name: Checkout biz-insight
        uses: actions/checkout@v5
        with:
          repository: Okpanz/biz-insight
          path: biz-insight
          token: ${{ secrets.BIZ_INSIGHT_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            biz-insight/package-lock.json
            brillix-desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install biz-insight dependencies
        working-directory: biz-insight
        run: npm ci

      - name: Install brillix-desktop dependencies
        working-directory: brillix-desktop
        run: npm ci

      - name: Build Windows app
        working-directory: brillix-desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Collect Windows release assets
        id: collect
        shell: bash
        run: |
          set -e
          BUNDLE_DIR="brillix-desktop/src-tauri/target/release/bundle/nsis"
          mkdir -p release-assets

          EXE=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name "*.exe" | head -n 1)
          SIG_FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -type f -name "*.exe.sig" | head -n 1)

          if [ -z "$EXE" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: expected Windows build outputs were not all generated."
            echo "exe=$EXE sig=$SIG_FILE"
            exit 1
          fi

          cp "$EXE" release-assets/Brillix-Windows-x64-Setup.exe
          cp "$SIG_FILE" release-assets/Brillix-Windows-x64-Setup.exe.sig

          echo "signature=$(cat "$SIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "Created:"
          ls -lh release-assets/

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          if command -v aws >/dev/null 2>&1; then
            echo "AWS CLI already available: $(aws --version)"
          else
            echo "AWS CLI not found on this runner — installing via pip..."
            PYTHON_BIN=$(command -v python3 || command -v python)
            "$PYTHON_BIN" -m pip install --user --quiet awscli
            echo "$APPDATA/Python/Scripts" >> "$GITHUB_PATH"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Upload Windows assets to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          BUCKET="s3://${{ secrets.R2_BUCKET_NAME }}/desktop-releases"

          aws s3 cp release-assets/Brillix-Windows-x64-Setup.exe "$BUCKET/Brillix-Windows-x64-Setup.exe" \
            --endpoint-url "$ENDPOINT" --content-type application/vnd.microsoft.portable-executable
          aws s3 cp release-assets/Brillix-Windows-x64-Setup.exe.sig "$BUCKET/Brillix-Windows-x64-Setup.exe.sig" \
            --endpoint-url "$ENDPOINT" --content-type text/plain

      - name: Save platform manifest fragment
        shell: bash
        run: |
          mkdir -p fragment
          cat > fragment/windows.json <<EOF
          {
            "windows-x86_64": {
              "signature": "${{ steps.collect.outputs.signature }}",
              "url": "${{ secrets.R2_PUBLIC_URL }}/desktop-releases/Brillix-Windows-x64-Setup.exe"
            }
          }
          EOF

      - name: Upload platform fragment
        uses: actions/upload-artifact@v4
        with:
          name: manifest-fragment-windows
          path: fragment/windows.json

      # Consumed only by publish-github-release, and only for a tagged run —
      # see the matching step in the macos job for why this isn't a Release
      # created directly from this job.
      - name: Upload Windows release assets (for GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets
          retention-days: 1

  # =================================================================
  # UPDATER MANIFEST — merges both platform jobs' fragments into the
  # single latest.json the desktop app polls (tauri.conf.json's
  # plugins.updater.endpoints). Runs on every trigger (tag or manual)
  # so manual runs can be used to test the full R2 publish path.
  # =================================================================

  publish-manifest:
    name: Publish updater manifest
    needs: [validate, macos, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5

      - name: Download platform fragments
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-fragment-*
          path: fragments
          merge-multiple: true

      - name: Build and upload latest.json
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -e
          NOTES=$(cat RELEASE_NOTES.md)
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --slurpfile macos fragments/macos.json \
            --slurpfile windows fragments/windows.json \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: ($macos[0] + $windows[0])
            }' > latest.json

          echo "Generated manifest:"
          cat latest.json

          aws s3 cp latest.json "s3://${{ secrets.R2_BUCKET_NAME }}/desktop-releases/latest.json" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --content-type application/json \
            --cache-control "no-cache"

  # =================================================================
  # GITHUB RELEASE — the single place a GitHub Release is created.
  # Only runs for a tagged production release (push of a v*.*.* tag);
  # never for workflow_dispatch, where there is no tag to attach a
  # release to. Artifacts come from the macOS/Windows jobs' uploaded
  # build artifacts, not the local filesystem of this job's runner.
  # =================================================================

  publish-github-release:
    name: Publish GitHub Release
    needs: [validate, macos, windows, publish-manifest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout brillix-desktop
        uses: actions/checkout@v5

      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets

      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Brillix Desktop ${{ github.ref_name }}
          draft: false
          body_path: RELEASE_NOTES.md
          files: |
            release-assets/Brillix-macOS-Universal.dmg
            release-assets/Brillix-macOS-Universal.app.tar.gz
            release-assets/Brillix-macOS-Universal.app.tar.gz.sig
            release-assets/Brillix-Windows-x64-Setup.exe
            release-assets/Brillix-Windows-x64-Setup.exe.sig
